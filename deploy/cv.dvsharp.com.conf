# cv.dvsharp.com — ClaudeVille 대시보드(claude-ville.service @ 127.0.0.1:4000).
# 설치: sudo ln -s /home/ubuntu/GitHub/claude-ville/deploy/cv.dvsharp.com.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTP -> HTTPS 는 dvsharp.conf 의 *.dvsharp.com:80 블록이 처리한다.
#
# 앱에 로그인이 없고 화면에 프롬프트·도구 기록이 그대로 나오므로 nginx 비밀번호(basic auth)가 유일한 관문이다.
# 계정 파일: /etc/nginx/auth/claude-ville.htpasswd (root:www-data 0640). 평문은 ~/.config/secrets/claude-ville-basic-auth.

# 다른 사이트가 브라우저에 저장된 비밀번호로 WebSocket 을 여는 것(cross-site WebSocket hijacking)을 막는다.
# basic auth 는 쿠키처럼 교차 출처 handshake 에도 실려 가므로 Origin 을 직접 본다.
map "$http_upgrade|$http_origin" $claude_ville_ws_forbidden {
    default 0;
    "~*^websocket\|(?!https://cv\.dvsharp\.com$)" 1;
}

server {
    listen 443 ssl;
    server_name cv.dvsharp.com;
    include /etc/nginx/cloudfront-generated/cloudfront-edge-real-ip.conf;

    ssl_certificate /etc/nginx/ssl/dvsharp.com.pem;
    ssl_certificate_key /etc/nginx/ssl/dvsharp.com.key;

    auth_basic "ClaudeVille";
    auth_basic_user_file /etc/nginx/auth/claude-ville.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "same-origin" always;
    # 앱의 API 가 Access-Control-Allow-Origin * 를 붙인다. 같은 출처만 쓰므로 숨긴다.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    location / {
        if ($claude_ville_ws_forbidden) { return 403; }
        limit_req zone=rl_general burst=40 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header X-Origin-Verify "";
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 실시간 갱신 WebSocket 을 오래 유지한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
